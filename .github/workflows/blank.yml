name: TITAN Android Build

on:
  workflow_dispatch:

jobs:
  build-llama-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout TITAN
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;29.0.14206865"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Clone llama.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama.cpp

      - name: Configure llama.cpp
        run: |
          cmake -B llama.cpp/build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_COMMON=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            llama.cpp

      - name: Build llama.cpp
        run: |
          cmake --build llama.cpp/build \
            --config Release \
            -j2

      - name: Prepare llama.cpp package
        run: |
          mkdir -p artifact/lib
          mkdir -p artifact/include

          find llama.cpp/build -type f -name "*.a" \
            -exec cp {} artifact/lib/ \;

          cp -r llama.cpp/include/* artifact/include/

          if [ -d "llama.cpp/ggml/include" ]; then
            mkdir -p artifact/include/ggml
            cp -r llama.cpp/ggml/include/* artifact/include/ggml/
          fi

          echo "Libraries:"
          find artifact/lib -type f -print

      - name: Upload llama.cpp Android libraries
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-android-arm64
          path: artifact/
          retention-days: 7
