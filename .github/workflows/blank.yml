name: TITAN Android Build

on:
  workflow_dispatch:

jobs:
  build-titan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout TITAN
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;29.0.14206865"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Clone llama.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama.cpp

      - name: Configure llama.cpp
        run: |
          cmake -B llama.cpp/build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_COMMON=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            llama.cpp

      - name: Build llama.cpp
        run: |
          cmake --build llama.cpp/build \
            --config Release \
            -j2

      - name: Configure TITAN native bridge
        run: |
          cmake \
            -S android \
            -B android/build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DLLAMA_SOURCE_DIR="$GITHUB_WORKSPACE/llama.cpp" \
            -DLLAMA_BUILD_DIR="$GITHUB_WORKSPACE/llama.cpp/build"

      - name: Build TITAN native bridge
        run: |
          cmake --build android/build \
            --config Release \
            -j2

      - name: Install native library into Android app
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a

          find android/build -type f -name "libtitan_native.so" \
            -exec cp {} android/app/src/main/jniLibs/arm64-v8a/ \;

          echo "Native library:"
          ls -lh android/app/src/main/jniLibs/arm64-v8a/

      - name: Generate Gradle wrapper
        run: |
          gradle -p android wrapper --gradle-version 8.11.1

      - name: Build Android APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TITAN-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
